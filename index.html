<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HS DAQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>HS DAQ</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#14171a;--mut:#667;--line:#d5d9df;--acc:#0b63ce;--go:#12813a;--stop:#c0271d;--warn:#b25c00}
@media (prefers-color-scheme:dark){:root{--bg:#101214;--card:#1b1e22;--fg:#eef0f2;--mut:#9aa3ad;--line:#343a41;--acc:#5aa2ff;--go:#2fae5c;--stop:#ef5a4f;--warn:#f0a23c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,system-ui,sans-serif;padding:0 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px}
header b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{color:var(--mut);font-size:11px}
main{padding:10px 10px 40px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 8px}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{min-height:64px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{font:inherit;font-weight:600;padding:12px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--stop)}
button.small{width:auto;padding:6px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0 10px}
.chip{width:auto;padding:8px 12px;font-size:14px;font-weight:500;border-radius:20px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lbl{font-size:12px;color:var(--mut)}
.list>div{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}.list .g{flex:1;min-width:0}.list small{color:var(--mut);display:block}
#tm{font:700 54px/1 ui-monospace,Menlo,monospace;text-align:center;margin:4px 0}
#tm2{text-align:center;color:var(--mut);font-size:13px;min-height:18px;margin-bottom:8px}
#big{font-size:26px;padding:26px 10px;color:#fff;border:0}
#big.s-ARC_START{background:var(--go)}#big.s-PLATE_IN,#big.s-PLATE_OUT{background:var(--acc)}#big.s-ARC_STOP{background:var(--stop)}
.steps{display:flex;gap:4px;margin:8px 0}.steps span{flex:1;text-align:center;font-size:11px;padding:4px 2px;border-radius:6px;background:var(--bg);color:var(--mut)}
.steps span.done{background:var(--go);color:#fff}
#warn{background:var(--stop);color:#fff;padding:10px 12px;font-weight:600}
#space{background:var(--warn);color:#fff;padding:10px 12px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:20}
#toast.on{opacity:1}
#cam{position:sticky;top:48px;z-index:4;background:#000;text-align:center}
#cam video{max-height:30vh;max-width:100%}
#cam span{position:absolute;left:8px;top:8px;background:var(--stop);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}.thumbs div{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--line)}
.thumbs button{position:absolute;right:-4px;top:-4px;width:24px;height:24px;padding:0;border-radius:12px;font-size:12px}
.mut{color:var(--mut);font-size:13px}.req{outline:2px solid var(--stop)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b id="title">HS DAQ</b><small id="ver">v2026-11-11e</small></header>
<div id="warn" hidden></div>
<div id="space" hidden></div>
<div id="cam" hidden><video id="pv" playsinline muted></video><span>REC</span></div>
<main id="app"></main>
<div id="toast"></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="videoIn" accept="video/*" capture="environment" hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>
<script src="core.js"></script>
<script>
(function () {
'use strict';
var C = HSCore, KEY = 'hsdaq.v1', $ = function (id) { return document.getElementById(id); };
var INTENTS = ['good / nominal', 'slag inclusion', 'porosity', 'lack of fusion (LOF)', 'long stickout', 'short stickout', 'single wire', 'other'];
var CONDITIONS = ['overspeed', 'roll attempt', 'long stickout', 'short stickout', 'single wire', 'low flux', 'water / wet flux', 'contaminated', 'parameters changed'];
var MARKS = ['arc dropped', 'arc-start failure', 'flux out', 'parameter change', 'induced defect here', 'visible defect', 'background noise', 'other'];
var S = load(), ui = { view: 'home' }, lastDown = 0, lastTap = {}, rec = null, stream = null, recMedia = null, wake = null;

/* ---------- storage ---------- */
function load() { try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {} return C.blank(); }
/* The records are saved twice on every change: in IndexedDB (large, the copy that counts on a long trip) and in
   localStorage (instant, but capped at about 5 MB by the browser). When the small one is full the app carries on
   with the large one. A counter (rev) says which copy is newer when the app opens. */
var lsFull = false, recBytes = 0;
function save() {
  S.rev = (S.rev || 0) + 1;
  var json = JSON.stringify(S), small = true; recBytes = json.length;
  try { localStorage.setItem(KEY, json); lsFull = false; }
  catch (e) { small = false; lsFull = true; try { localStorage.removeItem(KEY); } catch (e2) {} }
  putBlob('state', json).then(function () { if ($('warn').textContent.indexOf('SAVE FAILED') === 0) warn(''); }).catch(function () {
    if (small) return;   /* the small copy took it; nothing lost */
    warn('SAVE FAILED: phone storage is full or blocked. Export your data now, then Export > Free space.');
  });
  return true;
}
/* Storage level: warn before the phone refuses to save. Not every browser reports it; then no warning is possible. */
function checkStorage() {
  if (!(navigator.storage && navigator.storage.estimate)) return;
  navigator.storage.estimate().then(function (e) {
    var q = e.quota || 0, u = e.usage || 0, free = q - u, low = q > 0 && (u / q > 0.8 || free < 300 * 1048576), el = $('space');
    ui.free = q ? free : null; el.hidden = !low;
    if (low) el.textContent = 'Storage for this app is nearly full (' + mb(free) + ' left). Export photos and videos, then use Export > Free space.';
    var st = $('store'); if (st) st.textContent = 'Storage used by this app: ' + mb(u) + ' of about ' + mb(q) + ' allowed (' + mb(free) + ' free, roughly ' + Math.floor(free / (19 * 1048576)) + ' min of video).';
  }).catch(function () {});
}
function warn(t) { $('warn').textContent = t; $('warn').hidden = !t; }
function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { e.classList.remove('on'); }, 2600); }
var dbp = new Promise(function (res, rej) {
  var r = indexedDB.open('hsdaq', 1);
  r.onupgradeneeded = function () { r.result.createObjectStore('blobs'); };
  r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
});
function idb(mode, fn) {
  return dbp.then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('blobs', mode), q = fn(tx.objectStore('blobs'));
      tx.oncomplete = function () { res(q && q.result); }; tx.onerror = tx.onabort = function () { rej(tx.error || new Error('storage error')); };
    });
  });
}
function putBlob(k, b) { return idb('readwrite', function (s) { return s.put(b, k); }); }
function getBlob(k) { return idb('readonly', function (s) { return s.get(k); }); }
function range(p) { return IDBKeyRange.bound(p, p + '￿'); }
function getRange(p) { return idb('readonly', function (s) { return s.getAll(range(p)); }); }
function delRange(p) { return idb('readwrite', function (s) { return s.delete(range(p)); }); }
function mediaBlob(m) {
  if (m.kind === 'photo') return getBlob('m:' + m.id);
  return getRange('v:' + m.id + ':').then(function (parts) { return parts.length ? new Blob(parts, { type: m.mime || 'video/mp4' }) : null; });
}
function dropMediaBlobs(m) { return Promise.all([delRange('m:' + m.id), delRange('t:' + m.id), delRange('v:' + m.id + ':')]); }

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function obj(kind, id) {
  if (kind === 'v') return S.visit;
  return C.by({ s: S.sessions, j: S.joints, p: S.passes, e: S.events, i: S.insp }[kind] || [], id);
}
function field(label, key, val, attrs) {
  return '<label>' + label + '<input data-k="' + key + '" value="' + esc(val) + '" ' + (attrs || '') + '></label>';
}
function num(label, key, val) { return field(label, key, val, 'inputmode="decimal"'); }
function chips(key, opts, cur, multi) {
  return '<div class="chips">' + opts.map(function (o) {
    var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o, on = multi ? (cur || []).indexOf(v) >= 0 : cur === v;
    return '<button class="chip' + (on ? ' on' : '') + '" data-set="' + key + ':' + esc(v) + '"' + (multi ? ' data-multi="1"' : '') + '>' + esc(l) + '</button>';
  }).join('') + '</div>';
}
function tapTime() { var n = Date.now(); return (n - lastDown < 1500) ? lastDown : n; }
function clock(ms) { var d = new Date(ms); return C.pad(d.getHours(), 2) + ':' + C.pad(d.getMinutes(), 2) + ':' + C.pad(d.getSeconds(), 2); }
function dur(ms) { if (ms == null) return '–'; var s = ms / 1000; return Math.floor(s / 60) + ':' + C.pad((s % 60).toFixed(1), 4); }
function mb(n) { return (n / 1048576).toFixed(n > 10485760 ? 0 : 1) + ' MB'; }
function curPass() { return C.by(S.passes, ui.pid); }
function jointName(id) { var j = C.by(S.joints, id); return j ? (j.name || '(unnamed joint)') : '(no joint)'; }
function passLine(p) {
  var t = C.passTimes(S, p.id), n = C.mediaOf(S, 'passId', p.id);
  return '<b>W' + esc(C.weldIdList(p.weldIds).join(',') || '?') + ' · ' + esc(jointName(p.jointId)) + ' p' + esc(p.passNo) + '</b><small>' +
    esc([p.kind !== 'weld' ? p.kind : '', p.side, p.direction, p.intent].filter(Boolean).join(' · ')) + ' · ' +
    (t.arcStart == null ? 'not started' : t.welding ? 'WELDING' : dur(t.arcStop - t.arcStart)) +
    (n.length ? ' · ' + n.filter(function (m) { return m.kind === 'photo'; }).length + ' photo, ' + n.filter(function (m) { return m.kind === 'video'; }).length + ' video' : '') + '</small>';
}

/* ---------- views ---------- */
function vHome() {
  $('title').textContent = 'HS DAQ';
  var h = '<div class="card"><h2>Visit</h2><div class="row">' + field('Visit name', 'v::name', S.visit.name, 'placeholder="Site visit Nov 2026"') +
    field('Operator', 'v::operator', S.visit.operator) + '</div></div>';
  h += '<div class="card"><h2>Sessions (one per power-on of the unit)</h2><div class="list">' + (S.sessions.length ? S.sessions.slice().reverse().map(function (s) {
    var n = S.passes.filter(function (p) { return p.sessionId === s.id; }).length;
    return '<div data-act="go" data-arg="session:' + s.id + '"><div class="g"><b>Session ' + esc(C.sessionLabel(s)) + '</b><small>unit ' + esc(s.unit || '?') + ' · ' + n + ' passes' + (s.offsetMs == null ? ' · clock not checked' : '') + '</small></div><span>›</span></div>';
  }).join('') : '<div class="mut">No sessions yet.</div>') + '</div><button class="pri" data-act="newSession">+ New session</button></div>';
  h += '<div class="card"><h2>Joints</h2><div class="list">' + (S.joints.length ? S.joints.map(function (j) {
    var n = S.passes.filter(function (p) { return p.jointId === j.id; }).length, r = S.insp.filter(function (x) { return x.jointId === j.id; }).length;
    return '<div data-act="go" data-arg="joint:' + j.id + '"><div class="g"><b>' + esc(j.name || '(unnamed joint)') + '</b><small>' + esc(j.plateIn || '?') + ' in plate · ' +
      n + ' passes · ' + r + ' inspection reports</small></div><span>›</span></div>';
  }).join('') : '<div class="mut">No joints yet.</div>') + '</div><button data-act="newJoint">+ New joint</button></div>';
  var un = S.media.filter(function (m) { return !m.exported && !m.gone; }).length;
  h += '<div class="card"><h2>Export and backup</h2><button class="pri" data-act="go" data-arg="export">Export' + (un ? ' (' + un + ' media not yet exported)' : '') +
    '</button><p class="mut" id="store"></p><p class="mut" id="off"></p></div>';
  return h;
}
function vSession() {
  var s = C.by(S.sessions, ui.sid); if (!s) { ui.view = 'home'; return vHome(); }
  $('title').textContent = 'Session ' + C.sessionLabel(s);
  var ps = S.passes.filter(function (p) { return p.sessionId === s.id; }), cr = (s.clockReading || '').split(':');
  var h = '<button class="small" data-act="go" data-arg="home">‹ Home</button><div class="card" style="margin-top:8px"><h2>Unit (read these off the unit\'s screen)</h2><div class="row">' +
    field('SESSION number', 's:' + s.id + ':num', s.num, 'inputmode="numeric"') + field('Unit number', 's:' + s.id + ':unit', s.unit, 'inputmode="numeric" placeholder="1"') + '</div>' + field('Session notes', 's:' + s.id + ':notes', s.notes) + '</div>';
  h += '<div class="card"><h2>Clock check</h2><p class="mut">Type a time a few seconds ahead of the unit\'s clock, to the second, then tap the button the moment the unit shows it.</p>' +
    '<div class="row">' + ['H', 'M', 'S'].map(function (x, i) {
      return '<label>' + ['Hour', 'Min', 'Sec'][i] + '<input id="sync' + x + '" inputmode="numeric" maxlength="2" value="' + esc(cr[i] || '') + '"></label>';
    }).join('') + field('Timezone shown', 's:' + s.id + ':clockTz', s.clockTz, 'placeholder="PST"') + '</div>' +
    '<button class="small" data-act="syncPrefill">Fill in 15 s from now (phone clock)</button>' +
    '<button class="pri" style="margin-top:8px" data-act="sync" data-arg="' + s.id + '">Unit shows this time NOW</button>' +
    '<p class="mut">' + (s.offsetMs == null ? 'Not checked yet.' : 'Checked at ' + clock(s.clockPhone) + ' phone time: unit clock is ' + (s.offsetMs / 1000).toFixed(1) + ' s from the phone clock.') + '</p></div>';
  h += '<div class="card"><h2>Passes</h2><div class="list">' + (ps.length ? ps.map(function (p) {
    return '<div data-act="openPass" data-arg="' + p.id + '"><div class="g">' + passLine(p) + '</div><span>›</span></div>';
  }).join('') : '<div class="mut">No passes yet.</div>') + '</div><button class="pri" data-act="newPass" data-arg="' + s.id + '">+ New pass</button></div>';
  if (!ps.length) h += '<button class="danger" data-act="delSession" data-arg="' + s.id + '">Delete this session</button>';
  return h;
}
function photoStrip(list) {
  return '<div class="thumbs">' + list.map(function (m) {
    return '<div><img data-thumb="' + m.id + '" alt=""><button data-act="delMedia" data-arg="' + m.id + '">✕</button></div>';
  }).join('') + '</div>';
}
function vJoint() {
  var j = C.by(S.joints, ui.jid); if (!j) { ui.view = 'home'; return vHome(); }
  $('title').textContent = 'Joint ' + (j.name || '');
  var k = 'j:' + j.id + ':', used = S.passes.some(function (p) { return p.jointId === j.id; });
  var h = '<button class="small" data-act="back">‹ Back</button><div class="card" style="margin-top:8px"><h2>Joint</h2><div class="row">' +
    field('Joint ID', k + 'name', j.name, 'placeholder="J16"') + num('Plate length (in)', k + 'plateIn', j.plateIn) + num('Thickness (in)', k + 'thickIn', j.thickIn) + '</div><div class="row">' +
    num('Run-on tab (in)', k + 'leadTabIn', j.leadTabIn) + num('Run-off tab (in)', k + 'exitTabIn', j.exitTabIn) + '</div>' +
    field('Which end is station A, and how is it marked?', k + 'stationA', j.stationA, 'placeholder="end with the stamped ID; paint dot"') +
    '<div class="lbl">UT Face A is the</div>' + chips(k + 'faceA', ['front', 'back', 'unknown'], j.faceA) +
    '<div class="lbl">Plate flipped end-for-end for the backside (A and B swapped on the machine)?</div>' + chips(k + 'mirrored', ['yes', 'no', 'unknown'], j.mirrored) +
    field('Notes', k + 'notes', j.notes) + '<div class="lbl">Joint photos</div>' +
    photoStrip(S.media.filter(function (m) { return m.jointId === j.id && !m.inspId; })) +
    '<button style="margin-top:8px" data-act="photo" data-arg="jointId:' + j.id + '">Take joint photo</button></div>';
  h += '<div class="card"><h2>Inspection reports (UT / RT)</h2>' + S.insp.filter(function (r) { return r.jointId === j.id; }).map(function (r) {
    var q = 'i:' + r.id + ':';
    return '<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px">' + chips(q + 'method', ['UT', 'RT', 'VT', 'other'], r.method) + '<div class="row">' +
      field('Report title / number', q + 'report', r.report) + field('Report date', q + 'date', r.date, 'type="date"') + '</div>' + chips(q + 'result', ['accept', 'reject', 'pending'], r.result) +
      field('Note', q + 'note', r.note) + photoStrip(C.mediaOf(S, 'inspId', r.id)) +
      '<div class="row" style="margin-top:8px"><button data-act="photo" data-arg="inspId:' + r.id + '">Photo of report</button><button class="danger" data-act="delInsp" data-arg="' + r.id + '">Remove</button></div></div>';
  }).join('') + '<button style="margin-top:8px" data-act="addInsp" data-arg="' + j.id + '">+ Add inspection report</button></div>';
  if (!used) h += '<button class="danger" data-act="delJoint" data-arg="' + j.id + '">Delete this joint</button>';
  return h;
}
function vLive() {
  var p = curPass(); if (!p) { ui.view = 'home'; return vHome(); }
  var s = C.by(S.sessions, p.sessionId) || {}, k = 'p:' + p.id + ':', t = C.passTimes(S, p.id), step = C.nextStep(S, p.id), ev = C.passEvents(S, p.id);
  $('title').textContent = 'S' + (parseInt(s.num, 10) || '?') + ' · W' + (C.weldIdList(p.weldIds).join(',') || '?') + ' · ' + jointName(p.jointId) + ' p' + p.passNo;
  var h = '<button class="small" data-act="go" data-arg="session:' + p.sessionId + '">‹ Session</button>';
  h += '<div class="card" style="margin-top:8px"><div class="row"><label>Joint<select data-k="' + k + 'jointId"><option value="">choose…</option>' + S.joints.map(function (j) {
    return '<option value="' + j.id + '"' + (j.id === p.jointId ? ' selected' : '') + '>' + esc(j.name || '(unnamed)') + '</option>';
  }).join('') + '</select></label>' + field('Pass in joint', k + 'passNo', p.passNo, 'inputmode="numeric"') +
    field('WELD ID on unit', k + 'weldIds', p.weldIds, 'inputmode="numbers-and-punctuation" placeholder="3 or 3,4"') + '</div>' +
    '<button class="small" style="margin-bottom:10px" data-act="newJointForPass">+ New joint</button>' +
    '<div class="lbl">Side welded</div>' + chips(k + 'side', ['front', 'back'], p.side) +
    '<div class="lbl">Travel direction (plate stations)</div>' + chips(k + 'direction', [['A->B', 'A → B'], ['B->A', 'B → A']], p.direction) +
    '<div class="lbl">Recording is a</div>' + chips(k + 'kind', ['weld', 'test', 'background'], p.kind) + '</div>';
  h += '<div class="card"><div id="tm">0:00.0</div><div id="tm2"></div><div class="steps">' + ['ARC_START', 'PLATE_IN', 'PLATE_OUT', 'ARC_STOP'].map(function (x) {
    var done = { ARC_START: t.arcStart, PLATE_IN: t.plateIn, PLATE_OUT: t.plateOut, ARC_STOP: t.arcStop }[x] != null;
    return '<span class="' + (done ? 'done' : '') + '">' + C.LABEL[x] + '</span>';
  }).join('') + '</div><button id="big" class="s-' + step + '" data-act="step" data-arg="' + step + '">' +
    (step === 'ARC_START' ? (t.arcStart == null ? 'PASS STARTED' : 'ARC RESTARTED') : step === 'PLATE_IN' ? 'ENTERED PLATE' : step === 'PLATE_OUT' ? 'LEFT PLATE' : 'ARC STOPPED') + '</button>' +
    '<div class="row" style="margin-top:8px">' + (t.welding && step !== 'ARC_STOP' ? '<button class="danger" data-act="step" data-arg="ARC_STOP">Arc stopped</button>' : '') +
    '<button data-act="mark">Mark</button><button data-act="undo"' + (ev.length ? '' : ' disabled') + '>Undo</button></div>' +
    '<button class="small" style="margin-top:8px" data-act="splitId">Unit jumped to the next WELD ID mid-pass (still this pass)</button>';
  var mk = C.by(S.events, ui.markId);
  if (mk && mk.passId === p.id) h += '<div style="margin-top:10px"><div class="lbl">Mark at ' + (t.arcStart != null ? C.secs(t.arcStart, mk.t) + ' s' : clock(mk.t)) + ': what happened?</div>' +

  h += '</div>';

    Promise.all(list.map(function (m) { return mediaBlob(m).then(function (b) { return b ? b.arrayBuffer() : null; }); })).then(function (bufs) {
      var files = [], ok = [];
      list.forEach(function (m, i) { if (bufs[i]) { ok.push(m); files.push({ name: C.mediaName(S, m), bytes: new Uint8Array(bufs[i]) }); } });
      if (!ok.length) { toast('No photo files found on this phone'); return; }
      shareFiles([new File(C.zip(files), C.bundleName(S, stamp(), 'photos'), { type: 'application/zip' })], function () { ok.forEach(function (m) { m.exported = true; }); });
    }).catch(function (e) { toast('Could not load photos: ' + (e && e.message || e)); });
  },
  shareVideos: function () { var l = nextVideos(); if (l.length) { toast('Preparing ' + l.length + ' videos…'); shareMedia(l); } },
  shareVideo: function (id) { var m = C.by(S.media, id); if (m === recMedia) { toast('Stop the recording first'); return; } if (m) { toast('Preparing video…'); shareMedia([m]); } },
  pendingShare: function () {
    var p = ui.pending; if (!p) return; ui.pending = null;
    navigator.share({ files: p.files }).then(function () { finishShare(p.done); }).catch(function (err) { if (!err || err.name !== 'AbortError') toast('Share failed: ' + (err && err.message || err)); render(); });
  },
  restore: function () { $('restoreIn').value = ''; $('restoreIn').click(); },
  purge: function () {
    var list = S.media.filter(function (m) { return m.exported && !m.gone; });
    if (!confirm('Remove ' + list.length + ' exported photos / videos from this phone? Make sure they arrived where you sent them: this cannot be undone.')) return;
    Promise.all(list.map(dropMediaBlobs)).then(function () { list.forEach(function (m) { m.gone = true; }); save(); render(); toast('Removed'); });
  }
};
$('restoreIn').addEventListener('change', function () {
  var f = this.files && this.files[0]; if (!f) return;
  f.text().then(function (txt) {
    var b = JSON.parse(txt); if (!b || b.app !== 'hsdaq' || !b.state) throw new Error('not an HS DAQ backup file');
    var over = confirm('Where the backup and this phone both hold the same record, use the backup\'s copy?\n\nOK = backup wins. Cancel = keep this phone\'s copy and only add what is missing.');
    var r = C.mergeState(S, b.state, over); save(); render(); toast('Restored: ' + r.added + ' added, ' + r.replaced + ' replaced');
  }).catch(function (e) { toast('Restore failed: ' + (e && e.message || e)); });
});

/* ---------- wiring ---------- */
document.addEventListener('pointerdown', function () { lastDown = Date.now(); }, true);
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-k'); if (!k) return;
  var a = k.split(':'), o = obj(a[0], a[1]); if (!o) return;
  o[a[2]] = e.target.value;
  if (a[0] === 'p' && a[2] === 'jointId') {
    o.passNo = C.nextPassNo(S, o.jointId, o.id); save(); render(); return;
  }
  save();
});
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-set],[data-act]') : null; if (!t || t.disabled) return;
  if (t.hasAttribute('data-set')) {
    var a = t.getAttribute('data-set').split(':'), o = obj(a[0], a[1]), f = a[2], v = a.slice(3).join(':'); if (!o) return;
    if (t.hasAttribute('data-multi')) { o[f] = o[f] || []; var i = o[f].indexOf(v); if (i < 0) o[f].push(v); else o[f].splice(i, 1); }
    else o[f] = (o[f] === v ? '' : v);
    save(); render(); return;
  }
  var fn = ACT[t.getAttribute('data-act')]; if (fn) fn(t.getAttribute('data-arg') || '', t);
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && ui.view === 'live') wakeOn(); });
window.addEventListener('pagehide', function () { save(); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (ui.view === 'home') render(); });
}
if (window.self !== window.top) warn('This page is inside a frame: storage here may be temporary. Open it directly in Safari.');
/* Videos that were recording when the page died keep their saved pieces; give them an end time. */
/* Open with whichever saved copy is newer, then show the app. Never wait more than 1.5 s for the large storage
   area: if it is slow, open with the quick copy and switch only if nothing has been changed in the meantime. */
var booted = false, bootRev = null;
function boot() {
  if (booted) return; booted = true;
  try {
    if (!S.device) S.device = C.uid();
    S.media.forEach(function (m) { if (m.kind === 'video' && m.t0 && !m.t1) m.t1 = m.t0; });
    recBytes = JSON.stringify(S).length; bootRev = S.rev || 0;
    if (S.active && S.active.passId && C.by(S.passes, S.active.passId)) { ui.view = 'live'; ui.pid = S.active.passId; }
    render();
  } catch (e) { warn('APP ERROR at start: ' + (e && e.message || e)); }
}
getBlob('state').then(function (json) {
  var b = json ? JSON.parse(json) : null;
  if (!b || b.v !== 1 || (b.rev || 0) <= (S.rev || 0)) return;
  if (!booted) S = b;
  else if ((S.rev || 0) === bootRev) { S = b; booted = false; boot(); }
}).catch(function () {}).then(boot);
setTimeout(boot, 1500);
})();
